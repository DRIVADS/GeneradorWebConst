<!doctype html>
<html lang="es" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generar Constancia SAT</title>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background-color: var(--bs-tertiary-bg);
    }

    .form-signin {
      max-width: 380px;
      padding: 15px;
    }
  </style>
</head>

<body>

<main class="form-signin w-100 m-auto text-center">
  <form method="POST" action="https://sat-generator.onrender.com/generar">

    <!-- Modal Validación SAT -->
    <div class="modal fade" id="satModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Validando datos SAT</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body text-center" id="modalStatus">
            🔄 Preparando validación...
          </div>

          <div class="modal-footer">
            <button type="button" id="closeModalBtn" class="btn btn-secondary" data-bs-dismiss="modal" hidden>
              Cerrar
            </button>
          </div>

        </div>
      </div>
    </div>


    <img class="mb-2"
      src="https://cdn.cdnstep.com/rVmSfCiAOuSur6ASiAVw/2.thumb128.webp"
      alt="logo"
      width="110"
      height="110">

    <h1 class="h4 mb-3 fw-normal">Generador Ver 3.7.0 </h1>
    <p class="text-muted">Generador en línea</p>

    <div id="serverStatus" class="alert alert-warning py-2 mb-3" role="alert">
      🔄 Preparando servidor...
    </div>

    <div class="form-floating mb-3">
      <input
        type="text"
        class="form-control"
        id="id_cif"
        name="id_cif"
        placeholder="ID CIF"
        required>
      <label for="id_cif">ID CIF</label>
    </div>

    <div class="form-floating mb-3">
      <input
        type="text"
        class="form-control"
        id="rfc"
        name="rfc"
        placeholder="RFC"
        required
        style="text-transform: uppercase;">
      <label for="rfc">RFC</label>
    </div>

    <div class="form-floating mb-3">
      <input
        type="password"
        class="form-control"
        id="codigo"
        name="codigo"
        placeholder="Código de acceso"
        required>
      <label for="codigo">Código</label>
    </div>

    <button id="submitBtn" class="btn btn-primary w-100 py-2" type="submit" disabled>
      Generar constancia
    </button>

    <p class="mt-4 mb-3 text-body-secondary">
      © 2026 · SAT Generator · Validador
    </p>

  </form>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Arrancador-->
<script>
window.addEventListener("load", () => {
  fetch("https://sat-generator.onrender.com/", {
    mode: "no-cors",
    cache: "no-store"
  }).catch(() => {});
});
</script>

<script>
const statusBox = document.getElementById("serverStatus");
const submitBtn = document.getElementById("submitBtn");

async function wakeServer() {
  statusBox.className = "alert alert-warning py-2 mb-3";
  statusBox.innerHTML = "🔄 Preparando servidor...";

  const start = Date.now();

  try {
    await fetch("https://sat-generator.onrender.com/", {
      mode: "no-cors",
      cache: "no-store"
    });

    const time = Date.now() - start;

    if (time > 4000) {
      statusBox.className = "alert alert-success py-2 mb-3";
      statusBox.innerHTML = "✅ Servidor despertando (cold start)";
    } else {
      statusBox.className = "alert alert-success py-2 mb-3";
      statusBox.innerHTML = '✅ Servidor listo';
    }

    submitBtn.disabled = false;

  } catch {
    statusBox.className = "alert alert-danger py-2 mb-3";
    statusBox.innerHTML = "❌ No se pudo conectar al servidor";
  }
}

wakeServer();
</script>

<script>
const form = document.querySelector("form");
const idInput = document.getElementById("id_cif");
const rfcInput = document.getElementById("rfc");

const modal = new bootstrap.Modal(document.getElementById("satModal"));
const modalStatus = document.getElementById("modalStatus");
const closeBtn = document.getElementById("closeModalBtn");

form.addEventListener("submit", async function (e) {
  e.preventDefault();

  const idcif = idInput.value.trim();
  const rfc = rfcInput.value.trim().toUpperCase();

  if (!idcif || !rfc) {
    modalStatus.innerHTML = "❌ Completa IDCIF y RFC";
    closeBtn.hidden = false;
    modal.show();
    return;
  }

  closeBtn.hidden = true;
  modalStatus.innerHTML = "🔎 Validando RFC en SAT...";
  modal.show();

  const url = `https://siat.sat.gob.mx/app/qr/faces/pages/mobile/validadorqr.jsf?D1=10&D2=1&D3=${idcif}_${rfc}`;

  try {
    const res = await fetch(url);
    const html = await res.text();

    // ❌ Sin CIF
    if (html.includes("no se le ha emitido su Cédula de identificación fiscal")) {
      modalStatus.innerHTML = "❌ RFC válido pero SIN Cédula Fiscal";
      closeBtn.hidden = false;
      return;
    }

    // ❌ RFC inexistente
    if (html.includes("RFC no encontrado")) {
      modalStatus.innerHTML = "❌ RFC inexistente";
      closeBtn.hidden = false;
      return;
    }

    // ✅ OK
    modalStatus.innerHTML = "✅ RFC válido — Generando constancia...";
    
    setTimeout(() => {
      form.submit();
    }, 800);

  } catch {
    modalStatus.innerHTML = "⚠️ Error consultando SAT. Intenta de nuevo.";
    closeBtn.hidden = false;
  }
});
</script>






</body>
</html>
