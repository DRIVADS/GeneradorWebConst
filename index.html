<!doctype html>
<html lang="es" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generar Constancia SAT</title>

  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      padding-top: 40px;
      padding-bottom: 40px;
      background-color: var(--bs-tertiary-bg);
    }

    .form-signin {
      max-width: 380px;
      padding: 15px;
    }
  </style>
</head>

<body>

<main class="form-signin w-100 m-auto text-center">
  <form method="POST" action="https://sat-generator.onrender.com/generar">
    <img class="mb-2"
      src="https://cdn.cdnstep.com/rVmSfCiAOuSur6ASiAVw/2.thumb128.webp"
      alt="logo"
      width="110"
      height="110">

    <h1 class="h4 mb-3 fw-normal">Generador Ver 3.0.0 </h1>
    <p class="text-muted">Generador en línea</p>

    <div class="form-floating mb-3">
      <input
        type="text"
        class="form-control"
        id="id_cif"
        name="id_cif"
        placeholder="ID CIF"
        required>
      <label for="id_cif">ID CIF</label>
    </div>

    <div class="form-floating mb-3">
      <input
        type="text"
        class="form-control"
        id="rfc"
        name="rfc"
        placeholder="RFC"
        required
        style="text-transform: uppercase;">
      <label for="rfc">RFC</label>
    </div>

    <button class="btn btn-primary w-100 py-2" type="submit">
      Generar constancia
    </button>

    <p class="mt-4 mb-3 text-body-secondary">
      © 2025 · SAT Generator
    </p>

  </form>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
